<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CRM | Ajna Terapias</title>
    <link rel="stylesheet" href="/css/main.css">
</head>

<body class="portal-page">
    <main class="portal-card">
        <a class="brand" href="/">AJNA <span>TERAPIAS</span></a>
        <p class="eyebrow">Área restrita</p>
        <h1>CRM da clínica</h1>
        <p class="helper">Acesso exclusivo para administração autorizada.</p>
        <form id="crm-login" class="form">
            <label>E-mail
                <input name="email" type="email" autocomplete="email" required>
            </label>
            <label>Senha
                <input name="password" type="password" autocomplete="current-password" required>
            </label>
            <p class="error" id="form-error" role="alert"></p>
            <button class="button" type="submit">Entrar com segurança</button>
        </form>
    </main>
    <script src="/js/crm.js"></script>
</body>

</html>
